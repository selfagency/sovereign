# Sovereign — example configuration
# Copy to config.yml and edit. All values shown are defaults.

# Base domain for the identity server (the apex, e.g. example.com).
# Tenant handles live on subdomains of this (alice.example.com).
domain: example.com

# Audience claim for signed access tokens (the configured audience).
# Defaults to the base domain.
# audience: example.com

# Data directory: sqlite files, blobs, keys, certmagic cache.
data_dir: ./data

# Storage backend for protocol blobs (Solid, remoteStorage, atproto blobs).
#   fs:  local filesystem under data_dir/blobs
#   s3:  any S3-compatible endpoint
storage:
  backend: fs
  # s3:
  #   endpoint: https://s3.example.com
  #   bucket: sovereign-blobs
  #   access_key: ...
  #   secret_key: ...
  #   region: us-east-1

# IPFS pinning broker (optional, off by default). Broker mode — no embedded node.
ipfs:
  enabled: false

# Outbound email via stdlib net/smtp. Omitted/empty disables sending.
smtp:
  host: smtp.example.com
  port: 587
  # username: ...
  # password: ...
  # from: no-reply@example.com
  # tls: true   # STARTTLS

# Logging
log:
  level: info   # debug | info | warn | error
  format: text  # text | json

# Identity/auth subsystem.
auth:
  session:
    # DualRead: accept BOTH legacy JWT session cookies and new server-side
    # session rows during the migration window. Fail-safe default: true.
    # Flip to false and drop old JWT cookies after the transition release.
    dual_read: true

# Control-plane REST API (/api/v1).
api:
  # CORS allowlist for cross-origin browser access. Deny-by-default (empty).
  # Never use '*' alongside credentials. Empty disables cross-origin.
  cors_origins: []

# Allow anyone to self-register an account. Defaults to false (invite-only).
# open_registrations: false
