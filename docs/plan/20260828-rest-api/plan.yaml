  total_dependencies: 83
  risk_score: high
quality_warnings:
  - "P-1 scope rewrite is the single highest-risk change; must land alone (wave 1) with a regression test per existing call site."
  - "server.go is a shared integration point; T1.10 owns mounting /api/v1; same-wave tasks editing it are flagged conflicts_with."
  - "10 handler tasks batch in one wave (Phase 2 + Phase 3); disjoint files but heavy dispatch."
  - "Session dual-read (P-2) is config-gated (auth.session.dual_read, default TRUE); operator must flip to false and drop old JWT cookies after one release."
  - "GET /invite/{token} is anonymous and mints a session cookie; token-in-URL leaks via Referer/access logs (acknowledged under PII discipline)."

# ═══════════════════════════════════════════════════════════════════════════
# PLANNING ANALYSIS (HIGH complexity)
# ═══════════════════════════════════════════════════════════════════════════
assumptions:
  - "All D-1..D-9 decisions are signed off and fixed; ADR tasks only document them, they do not re-open them. D-4 is REVISED to 'handlers call store directly; thin orchestration layer only where cross-store'."
  - "P-1 scopeImplies implication table is small and explicit (e.g. profile:write implies profile:read); exact-match is the default, implications are opt-in per scope."
  - "No new runtime deps; kin-openapi is test-only. Any runtime dep addition requires justification (GPL-compat, CGO-free)."
  - "Thin clients use vendored simple.css (D-9); no design-system/token work, so gem-designer is not required for panel/admin clients."
  - "No browser E2E (USER-APPROVED decision 7); thin-client verification is Go asset/CSP header assertions."
  - "DELETE /me is request + admin approval, not immediate cascade (USER-APPROVED decision 4); pending_deletions table persists the request."
  - "admin is INSTANCE-scoped (Step 3); admin:* scopes require BOTH scope AND user.IsAdmin."
  - "auth.session.dual_read config (default TRUE) gates the P-2 dual-read window; api.cors_origins config gates CORS allowlist. Both added to config.go + config.example.yml (T0.7)."
  - "Programmatic tokens are self-issued via POST /me/tokens (show-once, scope-subset selection); end_user_programmatic principal retained."
  - "Per-route timeouts are configurable via a route-table column; backup run/restore declared long-running (not killed by default timeout)."
pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: "P-1 ScopesContains rewrite regresses permissions (over-grant or lockout) at an existing call site."
      likelihood: medium
      impact: critical
      mitigation: "Land P-1 alone (T0.1, wave 1) with a regression test per existing call site; exact-match default + explicit scopeImplies table; reviewer gate T0.6."
    - scenario: "P-2 session rework locks users out or leaks sessions across tenants."
      likelihood: medium
      impact: critical
      mitigation: "Dual-read for one release (accept old JWT + new session rows) gated by auth.session.dual_read (default TRUE, fail-safe against lockout); same cookie name, format-sniffed; both formats -> 400; concurrent session-revoke race test in T0.6."
    - scenario: "CSRF enforcement breaks scripted/bearer clients, misses cookie-principal unsafe methods, or blocks the no-JS form fallback."
      likelihood: medium
      impact: high
      mitigation: "Bearer path exempt by design (D-6); double-submit + Origin/Sec-Fetch-Site; CSRF x method x principal x content-type matrix (incl. form-encoded no-JS POST via hidden csrf_token field, synchronizer-token); document in CHANGELOG (T8.5)."
    - scenario: "Endpoint sprawl: a route merges with no scope requirement or no OpenAPI entry."
      likelihood: medium
      impact: high
      mitigation: "no-route-without-scope test + bidirectional OpenAPI drift test (D-5) make untested routes structurally hard to merge; enforced at T1.8."
    - scenario: "Thin client accretes into a de-facto framework (build step, npm, multiple modules)."
      likelihood: low
      impact: medium
      mitigation: "Hard cap: no build step, no npm, one shared module (web/shared/api.js); enforced by asset/CSP tests and reviewer gates T5.5/T6.2."
    - scenario: "Coverage dilution as handlers grow; store packages fall below 90%."
      likelihood: medium
      impact: medium
      mitigation: "Thin handlers (parse -> call store -> encode); coverage concentrates in store/; per-package gate in T8.6 and scripts/coverage-gate.sh."
    - scenario: "Decommission (Phase 7) deletes a function with no API/client surface, or leaves dead code / html/template outside web/ and hyperlink."
      likelihood: low
      impact: medium
      mitigation: "T7.1 feature-parity gate enumerates every function in panel.go + admin/{users,backup}.go and asserts each maps to an API endpoint + client surface before deletion; T7.2 deadcode clean + html/template audit; reviewer gate T7.3."
    - scenario: "Long-running backup restore killed by default per-route timeout."
      likelihood: low
      impact: high
      mitigation: "Per-route timeout is a route-table column; backup run/restore declared long-running; slow-restore-not-killed test in T3.3."
coordination_notes:
  - "server.go is the shared integration point across Phase 1, 2, 3, 5, 6, 7; T1.10 owns mounting the /api/v1 router into the running server. Same-wave tasks editing server.go are flagged conflicts_with and must coordinate on route registration order."
  - "Handlers call store directly (C1); no internal/core/* layer. Thin orchestration ONLY where cross-store: backup config -> scheduler (T3.3), proofs verify wiring (T2.4), capabilities derivation (T3.5). Store is net/http-free; transport (api/) is the only HTTP-aware layer. Enforce via import lint in reviewer gates."
  - "Migrations (P-4) are versioned and sequential; never edit a shipped migration, add a new one. Store creates schema directly today (store/store.go) until the runner lands. pending_deletions table added in T0.2."
  - "DTOs live in api/dto and are shared by self + admin endpoints; golden-file tests lock wire format before endpoints build on them. Admin lists use offset/limit; audit log keeps cursor pagination."
  - "OpenAPI spec (openapi/sovereign.v1.yaml) is source of truth; every endpoint task must keep route-set in parity with it (drift test T1.5)."
  - "Handler tasks depend on P-5 store methods and P-4 migrations; do not start Phase 2/3 handler work before Phase 0 exit gate T0.6 passes."
  - "web/shared/api.js is the single shared client module; panel (Phase 5) and admin (Phase 6) both consume it, so its API surface is a contract."
  - "Audit-log actor field (A8) folds into GET /admin/audit work (T3.6); real actor comes from P-2 session model."
  - "auth.session.dual_read + api.cors_origins config options are added in T0.7 (config.go + config.example.yml) before T0.3/T1.4 consume them."
