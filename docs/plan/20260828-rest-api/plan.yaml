# ═══════════════════════════════════════════════════════════════════════════
# PLAN METADATA
# ═══════════════════════════════════════════════════════════════════════════
plan_id: 20260828-rest-api
objective: Build a versioned JSON REST API (/api/v1) covering every admin and end-user control-plane capability, then reduce the server-rendered panel and admin pages to thin static clients that talk only to that API. Governs and supersedes the admin/panel work in the Steps 5-8 hardening.
created_at: 2026-08-28T00:00:00Z
created_by: gem-planner
status: pending
tldr: |
  9-phase migration (Phase 0..8) to a single authoritative /api/v1 surface with
  thin net/http handlers that call store directly (no internal/core layer; thin
  orchestration only where cross-store: backup->scheduler, proofs verify,
  capabilities). Prerequisites P-1..P-5 land first (P-1 scope fix alone in wave 1).
  Self API (Phase 2) and Admin API (Phase 3) parallelize after Phase 1; panel
  (Phase 5) and admin (Phase 6) clients parallelize after 2/3. Phase 7 decommissions
  old HTTP layers behind a feature-parity gate. Phase 8 hardens + documents.
  50 tasks, 22 waves, HIGH risk.

