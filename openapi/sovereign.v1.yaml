openapi: 3.1.0
info:
  title: Sovereign REST API
  version: "1.0.0"
  description: |
    Control-plane API for Sovereign tenants. Hand-written source of truth
    (D-5): the route set in internal/api/router.go must stay in parity with
    this spec in both directions, enforced by the OpenAPI drift test.
servers:
  - url: https://id.<domain>/api/v1
    description: Identity host, versioned API base.
# Default security for the API: bearer (programmatic) or session cookie
# (browser). Operations that are anonymous override this with `security: []`.
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /meta/capabilities:
    get:
      operationId: getCapabilities
      summary: Machine-readable wired features
      security: []
      responses:
        "200":
          description: Capabilities object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /meta/version:
    get:
      operationId: getVersion
      summary: Build version
      security: []
      responses:
        "200":
          description: Build version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ready:
    get:
      operationId: getReady
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /openapi.json:
    get:
      operationId: getOpenAPI
      summary: Serve the embedded OpenAPI spec
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 document
          content:
            application/json:
              schema:
                type: object
  /auth/invite/redeem:
    post:
      operationId: redeemInvite
      summary: Exchange an invite token for a session (programmatic)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRedeemRequest"
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
  /auth/session:
    get:
      operationId: getSession
      summary: Current principal, tenant, scopes, onboarding state
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSession
      summary: Revoke the current session
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Problem"
  /auth/session/refresh:
    post:
      operationId: refreshSession
      summary: Sliding renewal of the current session
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Renewed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
  /auth/webauthn/register/begin:
    post:
      operationId: webauthnRegisterBegin
      summary: Begin WebAuthn registration (session-derived user)
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Registration options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Problem"
  /auth/webauthn/register/finish:
    post:
      operationId: webauthnRegisterFinish
      summary: Finish WebAuthn registration
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnFinishRequest"
      responses:
        "200":
          description: Credential registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnResult"
        "400":
          $ref: "#/components/responses/Problem"
  /auth/webauthn/login/begin:
    post:
      operationId: webauthnLoginBegin
      summary: Begin WebAuthn login (anonymous, uniform for unknown handles)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnLoginBeginRequest"
      responses:
        "200":
          description: Assertion options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
  /auth/webauthn/login/finish:
    post:
      operationId: webauthnLoginFinish
      summary: Finish WebAuthn login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnFinishRequest"
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
  /invite/{token}:
    get:
      operationId: inviteBrowser
      summary: Redeem a magic-link token into a session cookie and redirect to the panel (anonymous)
      description: >
        Anonymous browser entry point (M1). Redeems the one-time invite token,
        creates a NEW server-side session, sets the opaque session cookie, and
        303-redirects to /panel. The token is single-use and persisted only as a
        hash; token-in-URL Referer/access-log leaks are acknowledged under the
        project's PII discipline.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "303":
          description: Session cookie set; redirect to /panel
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getSelf
      summary: Current principal identity
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Current identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateSelf
      summary: Update current principal identity
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSelfRequest"
      responses:
        "200":
          description: Updated identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: requestDeletion
      summary: Request account deletion (admin approval follows)
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "202":
          description: Deletion requested and pending admin approval
        "401":
          $ref: "#/components/responses/Problem"
  /me/onboarding:
    get:
      operationId: getOnboardingState
      summary: Current onboarding state
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "401":
          $ref: "#/components/responses/Problem"
  /me/tos:
    post:
      operationId: acceptToS
      summary: Accept the Terms of Service
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: ToS acceptance recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "401":
          $ref: "#/components/responses/Problem"
  /me/export:
    get:
      operationId: exportSelf
      summary: Export the current principal's data
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Full user data set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportData"
        "401":
          $ref: "#/components/responses/Problem"
  /me/profile:
    get:
      operationId: getSelfProfile
      summary: Get the current principal's profile page
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Profile page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePage"
        "404":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    put:
      operationId: upsertSelfProfile
      summary: Create or fully replace the profile page
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpsertRequest"
      responses:
        "200":
          description: Upserted profile page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSelfProfile
      summary: Delete the profile page (cascades to its links)
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: Profile deleted
        "401":
          $ref: "#/components/responses/Problem"
  /me/profile:publish:
    post:
      operationId: publishSelfProfile
      summary: Publish the profile page
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Published profile page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePage"
        "404":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /me/profile:unpublish:
    post:
      operationId: unpublishSelfProfile
      summary: Unpublish the profile page
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Unpublished profile page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePage"
        "404":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /me/profile/avatar:
    put:
      operationId: uploadSelfAvatar
      summary: Upload the profile avatar image
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarResponse"
        "413":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /me/profile/links:
    get:
      operationId: listSelfProfileLinks
      summary: List profile links in display order
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Ordered profile links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileLink"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: addSelfProfileLink
      summary: Add a profile link
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkWriteRequest"
      responses:
        "201":
          description: Created profile link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLink"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /me/profile/links/{id}:
    patch:
      operationId: updateSelfProfileLink
      summary: Update a profile link
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkWriteRequest"
      responses:
        "200":
          description: Updated profile link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLink"
        "404":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSelfProfileLink
      summary: Delete a profile link
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Profile link deleted
        "404":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /me/profile/links:reorder:
    post:
      operationId: reorderSelfProfileLinks
      summary: Reorder profile links
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkReorderRequest"
      responses:
        "200":
          description: Reordered profile links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileLink"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /me/keys:
    get:
      operationId: listSelfKeys
      summary: List the current principal's public keys
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Public keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicKey"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSelfKey
      summary: Register a public key
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicKeyCreateRequest"
      responses:
        "201":
          description: Created public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKey"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /me/keys/{id}:
    get:
      operationId: getSelfKey
      summary: Get a single public key
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKey"
        "404":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSelfKey
      summary: Delete a public key
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Public key deleted
        "404":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /me/keys/{id}/revoke:
    post:
      operationId: revokeSelfKey
      summary: Revoke a public key
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKey"
        "404":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /me/proofs:
    get:
      operationId: listSelfProofs
      summary: List the current principal's proof claims
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Proof claims
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProofClaim"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSelfProof
      summary: Create a proof claim
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProofCreateRequest"
      responses:
        "201":
          description: Created proof claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofClaim"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /me/proofs/{id}:
    get:
      operationId: getSelfProof
      summary: Get a single proof claim
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proof claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofClaim"
        "404":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSelfProof
      summary: Delete a proof claim
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Proof claim deleted
        "404":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /me/proofs/{id}/verify:
    post:
      operationId: verifySelfProof
      summary: Verify a proof claim
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verified proof claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProofClaim"
        "404":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /me/sessions:
    get:
      operationId: listSelfSessions
      summary: List the current principal's sessions
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeAllSelfSessions
      summary: Revoke all of the current principal's sessions
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: All sessions revoked
        "401":
          $ref: "#/components/responses/Problem"
  /me/sessions/{id}:
    delete:
      operationId: revokeSelfSession
      summary: Revoke one session
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session revoked
        "404":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        errors:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
        detail:
          type: string
    User:
      type: object
      required: [id, handle]
      properties:
        id:
          type: string
        handle:
          type: string
        display_name:
          type: string
        is_admin:
          type: boolean
    Session:
      type: object
      required: [user, scopes]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          type: string
        scopes:
          type: array
          maxItems: 64
          items:
            type: string
        onboarding:
          type: object
    Capabilities:
      type: object
      additionalProperties: true
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
    InviteRedeemRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    WebAuthnOptions:
      type: object
      additionalProperties: true
    WebAuthnLoginBeginRequest:
      type: object
      properties:
        handle:
          type: string
    WebAuthnFinishRequest:
      type: object
      additionalProperties: true
    WebAuthnResult:
      type: object
      additionalProperties: true
    UpdateSelfRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 100
    OnboardingState:
      type: object
      required: [tos_accepted, has_passkey, has_profile, complete]
      properties:
        tos_accepted:
          type: boolean
        has_passkey:
          type: boolean
        has_profile:
          type: boolean
        complete:
          type: boolean
    ExportData:
      type: object
      required: [user, links, keys, proofs]
      properties:
        user:
          $ref: "#/components/schemas/User"
        profile:
          $ref: "#/components/schemas/ProfilePage"
        links:
          type: array
          items:
            $ref: "#/components/schemas/ProfileLink"
        keys:
          type: array
          items:
            $ref: "#/components/schemas/PublicKey"
        proofs:
          type: array
          items:
            $ref: "#/components/schemas/ProofClaim"
    ProfilePage:
      type: object
      properties:
        id:
          type: string
        display_name:
          type: string
        bio:
          type: string
        is_published:
          type: boolean
        avatar_url:
          type: string
          format: uri
        theme:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProfileUpsertRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 100
        bio:
          type: string
        is_published:
          type: boolean
    ProfileLink:
      type: object
      required: [id, label, url]
      properties:
        id:
          type: string
        label:
          type: string
        url:
          type: string
          format: uri
        position:
          type: integer
    LinkWriteRequest:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
        url:
          type: string
          format: uri
    LinkReorderRequest:
      type: object
