                $ref: "#/components/schemas/ToSDocument"
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /admin/system/info:
    get:
      operationId: adminSystemInfo
      summary: Server config summary with secrets redacted (instance admin, scope admin:system:read)
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Config summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        errors:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
        detail:
          type: string
    User:
      type: object
      required: [id, handle]
      properties:
        id:
          type: string
        handle:
          type: string
        display_name:
          type: string
        is_admin:
          type: boolean
    Session:
      type: object
      required: [user, scopes]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          type: string
        scopes:
          type: array
          maxItems: 64
          items:
            type: string
        onboarding:
          type: object
    Capabilities:
      type: object
      additionalProperties: true
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
    InviteRedeemRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    WebAuthnOptions:
      type: object
      additionalProperties: true
    WebAuthnLoginBeginRequest:
      type: object
      properties:
        handle:
          type: string
    WebAuthnFinishRequest:
      type: object
      additionalProperties: true
    WebAuthnResult:
      type: object
      additionalProperties: true
    UpdateSelfRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 100
    OnboardingState:
      type: object
      required: [tos_accepted, has_passkey, has_profile, complete]
      properties:
        tos_accepted:
          type: boolean
        has_passkey:
          type: boolean
        has_profile:
          type: boolean
        complete:
          type: boolean
    ExportData:
      type: object
      required: [user, links, keys, proofs]
      properties:
        user:
          $ref: "#/components/schemas/User"
        profile:
          $ref: "#/components/schemas/ProfilePage"
        links:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ProfileLink"
        keys:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/PublicKey"
        proofs:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/ProofClaim"
    ProfilePage:
      type: object
      properties:
        id:
          type: string
        display_name:
          type: string
        bio:
          type: string
        is_published:
          type: boolean
        avatar_url:
          type: string
          format: uri
        theme:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProfileUpsertRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 100
        bio:
          type: string
        is_published:
          type: boolean
    ProfileLink:
      type: object
      required: [id, label, url]
      properties:
        id:
          type: string
        label:
          type: string
        url:
          type: string
          format: uri
        position:
          type: integer
    LinkWriteRequest:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
        url:
          type: string
          format: uri
    LinkReorderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 32
          items:
            type: string
    PublicKey:
      type: object
      required: [id, key]
      properties:
        id:
          type: string
        type:
          type: string
        key:
          type: string
        comment:
          type: string
        fingerprint:
          type: string
        revoked:
          type: boolean
        created_at:
          type: string
          format: date-time
    PublicKeyCreateRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
        comment:
          type: string
    ProofClaim:
      type: object
      required: [id]
      properties:
        id:
          type: string
        type:
          type: string
        value:
          type: string
        status:
          type: string
        verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProofCreateRequest:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
        value:
          type: string
    AvatarResponse:
      type: object
      required: [avatar_url]
      properties:
        avatar_url:
          type: string
          format: uri
    SessionInfo:
      type: object
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time

    APIToken:
      type: object
      description: A programmatic API token (metadata only; the raw token is show-once and never re-served)
      properties:
        id:
          type: string
        family_id:
          type: string
        name:
          type: string
        scopes:
          type: array
          maxItems: 64
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    APITokenCreateRequest:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
        name:
          type: string
    APITokenCreateResponse:
      type: object
      description: Created token. token carries the raw value, returned exactly once (show-once).
      allOf:
        - $ref: "#/components/schemas/APIToken"
      properties:
        token:
          type: string
    WebAuthnCredential:
      type: object
      description: A registered passkey. Public key material and attestation data are never served.
      properties:
        id:
          type: string
        credential_id:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    Tenant:
      type: object
      properties:
        id:
          type: string
        handle:
          type: string
        did:
          type: string
        created_at:
          type: string
          format: date-time
    CreateTenantRequest:
      type: object
      properties:
        id:
          type: string
        handle:
          type: string
        did_method:
          type: string
        did:
          type: string
    Client:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        audience:
          type: string
        created_at:
          type: string
          format: date-time
    ClientWithSecret:
      type: object
      properties:
        client:
          $ref: "#/components/schemas/Client"
        secret:
          type: string
    CreateClientRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
    ClientSecret:
      type: object
      properties:
        secret:
          type: string
    Takedown:
      type: object
      properties:
        id:
          type: string
        resource:
          type: string
        reason:
          type: string
        acted_by:
          type: string
        created_at:
          type: string
          format: date-time
    CreateTakedownRequest:
      type: object
      required: [resource, reason]
      properties:
        resource:
          type: string
        reason:
          type: string
    BackupConfig:
      type: object
      properties:
        schedule:
          type: string
        destination:
          type: string
        prefix:
          type: string
        updated_at:
          type: string
          format: date-time
    BackupRun:
      type: object
      properties:
        id:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        error:
          type: string
          nullable: true
        size_bytes:
          type: integer
        destination_key:
          type: string
    BackupRestore:
      type: object
      properties:
        id:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        error:
          type: string
          nullable: true
        source_key:
          type: string
        requested_by:
          type: string
    RestoreRequest:
      type: object
      required: [source_key, confirm]
      properties:
        source_key:
          type: string
        confirm:
          type: boolean
    AuditEntry:
      type: object
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
        resource:
          type: string
        detail:
          type: string
        created_at:
          type: string
          format: date-time
    PendingDeletion:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        requested_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, approved, rejected]
        approved_by:
          type: string
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
    SystemInfo:
      type: object
      properties:
        domain:
          type: string
        audience:
          type: string
        data_dir:
          type: string
        open_registrations:
          type: boolean
        storage_backend:
          type: string
        ipfs_enabled:
          type: boolean
        smtp_enabled:
          type: boolean
        smtp_host:
          type: string
        smtp_from:
          type: string
        api_cors_origins:
          type: array
          maxItems: 100
          items:
            type: string
    ToSDocument:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        content:
          type: string
        published_at:
          type: string
          format: date-time
        published_by:
          type: string
    PutToSRequest:
      type: object
      required: [version, content]
      properties:
        version:
          type: string
        content:
          type: string
    IPFSPin:
      type: object
      required: [cid, status]
      properties:
        cid:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
    AddPinRequest:
      type: object
      required: [cid]
      properties:
        cid:
          type: string
    CreateUserRequest:
      type: object
      required: [handle, email]
      properties:
        tenant_id:
          type: string
        handle:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        is_admin:
          type: boolean
    UpdateUserRequest:
      type: object
      properties:
        is_admin:
          type: boolean
        email:
          type: string
          format: email
        display_name:
          type: string
